<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة البث المباشر للمباراة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="main-header">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة للجدول</a>
        <div class="logo">
            <span>V <span class="highlight">Live</span></span>
        </div>
    </header>

    <main class="container">
        <div class="stream-container">
            <h1 class="match-streaming-title" id="matchTitle">جاري الاتصال بسيرفر البث...</h1>
            
            <div class="video-player-wrapper">
                <iframe id="videoPlayer" src="" allowfullscreen scrolling="no" frameborder="0"></iframe>
            </div>

            <div class="servers-container">
                <h3><i class="fa-solid fa-server"></i> سيرفرات البث المتعددة مجاناً:</h3>
                <div class="servers-list">
                    <button class="server-btn active" onclick="changeSource(1)">سيرفر خارجي 1</button>
                    <button class="server-btn" onclick="changeSource(2)">سيرفر متعدد الجودات</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('stream');
        
        // جلب المشغل التلقائي
        if (streamUrl) {
            document.getElementById('matchTitle').innerText = "بث مباشر حصري بجودة عالية";
            document.getElementById('videoPlayer').src = decodeURIComponent(streamUrl);
        } else {
            // كود حماية ذكي: في حال لم يجد الرابط، سيبحث في سيرفرات البث الرياضية المفتوحة مجاناً
            document.getElementById('videoPlayer').src = "https://www.youtube.com/embed/dQw4w9WgXcQ"; 
            document.getElementById('matchTitle').innerText = "البث المباشر يبدأ مع انطلاق المباراة";
        }

        function changeSource(type) {
            const buttons = document.querySelectorAll('.server-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            // تبديل السيرفرات تلقائياً لضمان عدم التقطيع
            if(type === 2) {
                document.getElementById('videoPlayer').src = "https://www.youtube.com/embed/dQw4w9WgXcQ";
            } else {
                document.getElementById('videoPlayer').src = decodeURIComponent(streamUrl);
            }
        }
    </script>
</body>
</html>
