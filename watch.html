<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الأنمي بث مباشر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header" style="display: flex; justify-content: space-between; align-items: center;">
        <div class="logo">V <span>Anime</span></div>
        <a href="index.html" style="color: #fff; text-decoration: none; font-size: 14px;"><i class="fa-solid fa-arrow-left"></i> العودة للمكتبة</a>
    </header>

    <main class="container" style="max-width: 700px; margin: 0 auto; text-align: center;">
        <h2 id="animeMainTitle" style="font-size: 18px; margin-bottom: 15px; color: #fff;">جاري تحميل الأنمي...</h2>
        
        <div class="video-wrapper" style="position: relative; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
            <iframe id="animePlayer" src="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" allowfullscreen frameborder="0" scrolling="no"></iframe>
        </div>

        <p style="color: #8a99ad; font-size: 12px; margin-top: 15px;">
            <i class="fa-solid fa-info-circle"></i> يتم جلب السيرفرات والحلقات تلقائياً بناءً على معرف الأنمي العالمي.
        </p>
    </main>

    <script>
        // التقاط البيانات من الرابط تلقائياً
        const urlParams = new URLSearchParams(window.location.search);
        const animeId = urlParams.get('id');
        const animeTitle = urlParams.get('title');

        if (animeId && animeTitle) {
            // عرض اسم الأنمي في العنوان
            document.getElementById('animeMainTitle').innerText = decodeURIComponent(animeTitle);
            
            // ربط المشغل بسيرفر مشغل أنمي مفتوح ومجاني (تلقائي بالـ ID وبدون داتا باز!)
            // نستخدم سيرفر Consumet أو نظام تضمين الأنمي المفتوح الشهير
            document.getElementById('animePlayer').src = `https://vidsrc.to/embed/anime/${animeId}`;
        } else {
            document.getElementById('animeMainTitle').innerText = "خطأ: لم يتم العثور على الأنمي المطلوبة";
        }
    </script>
</body>
</html>
